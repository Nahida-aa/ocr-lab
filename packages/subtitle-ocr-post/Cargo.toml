[package]
name = "subtitle-ocr-post"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OCR post-processing algorithms (merge, filter, adjust) — no ort/opencv dependency."

[features]
default = []
# 为 OCR 结果类型导出 specta::Type（供 LocalDub fnrpc 注册进 bindings）。
specta-types = ["specta", "ocr-types/specta-types"]

[dependencies]
ocr-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true, optional = true }
