[package]
name = "subtitle-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
# 多 [[bin]] 时显式指定 cargo run 默认运行的二进制（否则 cargo run 报错无法确定）。
default-run = "subtitle-ocr"

# 既是库（供上层复用 OcrEngine + 字幕合并/计时）也是二进制（对标 cpp 的 CLI）。
[lib]
name = "subtitle_ocr"
path = "src/lib.rs"

[[bin]]
name = "subtitle-ocr"
path = "src/main.rs"

[[bin]]
name = "merge-frames"
path = "src/bin/merge_frames_cli.rs"

[[bin]]
name = "ocr-frames-adjust-box"
path = "src/bin/ocr_frames_adjust_box_cli.rs"

[[bin]]
name = "ocr-frames-filter-box"
path = "src/bin/ocr_frames_filter_box_cli.rs"

[[bin]]
name = "ocr-segment-adjust"
path = "src/bin/ocr_segment_adjust_cli.rs"

[[bin]]
name = "ocr-segment-filter"
path = "src/bin/ocr_segment_filter_cli.rs"

[[bin]]
name = "ocr-post"
path = "src/bin/ocr_post_cli.rs"

[dependencies]
# OCR 引擎（det/rec/cls 推理 + 模型加载 + 字典），本包只做字幕专属逻辑。
# 纯感知层（合并逻辑已迁入本包的 ocr_post::merge_frames / merge-frames CLI）。
rapidocr-ort = { workspace = true }
# 复用 rapidocr-ort 同款向量的按分量 min/max（SSE），与 polygon_metrics 一致。
glam.workspace = true
# 错误链 / 图像读取（RGB HWC u8）/ 张量 / 序列化 / CLI。
anyhow.workspace = true
image.workspace = true
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# 日志：库内仅发 tracing 事件（不初始化 subscriber），二进制在 main 里初始化。
tracing.workspace = true
tracing-subscriber.workspace = true
# 进度条（UX 层反馈，独立于 tracing 诊断日志）。
indicatif.workspace = true
# 读取视频高度（ocr-segment-adjust 的 Y 偏移惩罚归一化分母），从视频文件取而非手填。
ffmpeg-next = { workspace = true }
