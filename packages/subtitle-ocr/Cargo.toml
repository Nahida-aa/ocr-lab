[package]
name = "subtitle-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true

# 既是库（供上层复用 OcrEngine + 字幕合并/计时）也是二进制（对标 cpp 的 CLI）。
[lib]
name = "subtitle_ocr"
path = "src/lib.rs"

[[bin]]
name = "subtitle-ocr"
path = "src/main.rs"

# [[bin]]
# name = "merge-frames"
# path = "src/bin/merge_frames_cli.rs"

# [[bin]]
# name = "ocr-frames-adjust-box"
# path = "src/bin/ocr_frames_adjust_box_cli.rs"

# [[bin]]
# name = "ocr-frames-filter-box"
# path = "src/bin/ocr_frames_filter_box_cli.rs"

# [[bin]]
# name = "ocr-segment-adjust"
# path = "src/bin/ocr_segment_adjust_cli.rs"

# [[bin]]
# name = "ocr-segment-filter"
# path = "src/bin/ocr_segment_filter_cli.rs"

[dependencies]
# OCR 引擎（det/rec/cls 推理 + 模型加载 + 字典），本包只做字幕专属逻辑。
# 纯感知层，不依赖 subtitle-ocr-merge（合并是上游职责）。
rapidocr-ort = { workspace = true }
# 复用 rapidocr-ort 同款向量的按分量 min/max（SSE），与 polygon_metrics 一致。
glam.workspace = true
# 错误链 / 图像读取（RGB HWC u8）/ 张量 / 序列化 / CLI。
anyhow.workspace = true
image.workspace = true
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
