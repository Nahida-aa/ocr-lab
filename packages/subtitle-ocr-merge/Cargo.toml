[package]
name = "subtitle-ocr-merge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "字幕 OCR 帧合并层：把逐帧（带时间戳 timestamp_ms）的 FrameResult 聚合成带时间轴的字幕段。独立于视频/截图来源，供多项目复用。"

[lib]
name = "subtitle_ocr_merge"
path = "src/lib.rs"

[dependencies]
# 取 FrameResult / aggregate_boxes / OcrBoxResult（单图聚合结果与单框结果）。
# 依赖方向：本层 → subtitle-ocr（感知层），subtitle-ocr 不反向依赖本层，
# 以保持 subtitle-ocr 作为纯感知库、不耦合合并逻辑。
subtitle-ocr = { workspace = true }
# Segment 需要序列化；levenshtein/merge 纯算法无外部依赖。
serde.workspace = true
serde_json.workspace = true
