[package]
name = "subtitle-ocr-merge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "字幕 OCR 帧合并层：把逐帧（带时间戳）的 OcrImgResult 聚合成带时间轴的字幕段。独立于视频/截图来源，供多项目复用。"

[lib]
name = "subtitle_ocr_merge"
path = "src/lib.rs"

[dependencies]
# 取 OcrBoxResult（单框结果），本层在其上定义 OcrImgResult / FrameResult / Segment。
# 注意：本 crate 不反向依赖 subtitle-ocr，以保持依赖单向（subtitle-ocr → 本层 → rapidocr-ort）。
rapidocr-ort = { workspace = true }
# Segment 需要序列化；levenshtein/merge 纯算法无外部依赖。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
