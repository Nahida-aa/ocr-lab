[package]
name = "ocr-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure data types + utility functions for OCR pipeline (no heavy deps like ort/opencv)."

[features]
default = []
# 为 OCR 结果类型导出 specta::Type（供 LocalDub fnrpc 注册进 bindings）。
specta-types = ["specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { workspace = true, optional = true }
