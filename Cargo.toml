[workspace]
resolver = "3"
members = [
    "packages/rapidocr-ort", "tools/gen_ui_img", "tools/accel-set", "packages/subtitle-ocr",
    "packages/geometry",
    # 基准测试驱动（独立 cargo 包，见 tests/bench/subtitle-ocr）。
    # 不属于常规构建目标，故不放进 default-members。
    "tests/bench/subtitle-ocr",
]

# default-members：当你只敲 `cargo build` / `cargo run`（不带 -p）时，
# cargo 实际去构建哪些成员。这里只默认构建 apps/*（二进制例子），
# 不碰 crates/*（库）与 tests/bench 基准包。原因：
#   - 库本身没有 main，单独 `cargo run` 无意义；
#   - 新人clone后直接 `cargo run` 不会误触发所有内部库的编译，体验更轻；
#   - bench 是可选基准工具，不应拖累默认构建。
# 想全量构建时，用 `cargo build --workspace`。
default-members = [
    "tools/gen_ui_img", "tools/accel-set", "packages/subtitle-ocr",
]

# [workspace.package] 里写的字段会被子包用 `version.workspace = true` 继承。
# 这样全仓库版本号、edition、license 统一改一处即可。
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
# 仓库 description 的唯一源（GitHub 仓库简介 + crates.io 共用一句话）。
description = "OCR + 屏幕自动化 agent：看/操作分离，ydotool + KWin"

# GitHub 仓库元数据的唯一源（description 见上方，topics 见下）。
# 用自定义 metadata 段，不污染 crates.io 的 keywords 语义（后者限 5 个）。
# 同步命令见仓库根 sync-github-meta.sh：改这里一处即可刷到 GitHub。
[workspace.metadata.github]
topics = [
    "ocr",
    "screen-automation",
    "computer-use",
    "agent",
    "ydotool",
    "wayland",
    "kwin",
    "rust",
]

[workspace.dependencies]
anyhow = "1.0"
tracing = "0.1"
rust-embed = { version = "8.11", features = ["include-exclude"] }
# 通用图像转换工具（rgba→rgb 等），与业务解耦。
image-util = { path = "crates/image_util" }
image = "0.25"
opencv = { version = "0.100.0", default-features = false, features = ["imgproc"] }
ort = "2.0.0-rc.13"
burn = "0.21.0"
util = { path = "packages/util" }
glam = "0.33.2"
# PP-OCR det/rec/cls 引擎（onnxruntime 推理 + DB 后处理）。
# 跨包共享，统一走 workspace，改 path/版本只动这一处。
rapidocr-ort = { path = "packages/rapidocr-ort" }
# 屏幕抓取（ScreenCast 窗口流 / 全屏）。已随仓库结构迁移到 packages/ 下，
# 跨包共享，统一走 workspace。
capturer = { path = "packages/capturer" }
# gpui 相关依赖统一在 workspace 声明语义版本，真正的 git 源由下方
# [patch.crates-io] 覆盖（cargo 要求 patch 只能写在 workspace 根）。
gpui = { version = "0.2.2", default-features = false }
gpui_macros = { version = "0.1.0" }
gpui_platform = { version = "0.1.0" }
gpui_web = { version = "0.1.0" }
gpui_util = { version = "0.1.0" }
gpui_wgpu = { version = "0.1.0" }

# [patch.crates-io]：把 crates.io 上的 gpui 系列包整体替换为 zed 仓库对应 rev。
# 注意 patch 必须写在 workspace 根（子包里的 patch 会被 cargo 忽略并报错）。
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
